# Prüft jeden Push und jeden Pull Request: Linter, Tests, Build, bekannte Lücken.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Linter
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build
        run: npm --prefix client run build
      - name: Bekannte Sicherheitslücken (Server, ab Stufe „hoch")
        run: npm audit --omit=dev --audit-level=high
